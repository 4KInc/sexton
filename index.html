<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sexton</title>
    <link rel="icon" href="data:," />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/ui/fonts/ibm-plex-sans-latin-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/ui/fonts/ibm-plex-mono-latin-400.woff2" />
    <link rel="preload" as="fetch" href="%BASE_URL%register.json" crossorigin="anonymous" />
    <meta name="description" content="A public register of retired geostationary satellites." />
  </head>
  <body>
    <a class="skip-link" id="skip-main" href="#main">Skip to main content</a>
    <svg class="shared-defs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <pattern id="stone-hatch" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line class="stone-hatch-line" x1="0" y1="0" x2="0" y2="3.2" />
        </pattern>
        <pattern id="wall-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect class="hatch-bg" width="7" height="7" />
          <line class="hatch-line" x1="0" y1="0" x2="0" y2="7" />
        </pattern>
        <linearGradient id="sky-fade" x1="0" y1="0" x2="0" y2="1"><stop class="sky-stop-top" offset="0" /><stop class="sky-stop-bottom" offset="1" /></linearGradient>
        <radialGradient id="moon-fade"><stop class="moon-stop-in" offset="0" /><stop class="moon-stop-out" offset="1" /></radialGradient>
        <radialGradient id="halo-fade"><stop class="halo-stop-in" offset="0" /><stop class="halo-stop-out" offset="1" /></radialGradient>
        <radialGradient id="fog-fade"><stop class="fog-stop-in" offset="0" /><stop class="fog-stop-out" offset="1" /></radialGradient>
        <clipPath id="stone-clip"><path d="M -5 0 L -5 -9 A 5 5 0 0 1 5 -9 L 5 0 Z" /></clipPath>
        <clipPath id="above-ground"><rect x="-20" y="-40" width="40" height="40" /></clipPath>
      </defs>
    </svg>
    <div id="sample-banner" class="sample-banner" role="status" hidden></div>
    <header class="site-header">
      <div class="site-brand">
        <svg class="site-mark" viewBox="0 0 24 30" width="26" height="32" aria-hidden="true" focusable="false">
          <path class="site-mark-stone" d="M3 28 V12 A9 9 0 0 1 21 12 V28 Z" />
          <path class="site-mark-cross" d="M12 8 V20 M7.5 12.5 H16.5" />
        </svg>
        <div>
          <p class="site-title">Sexton</p>
          <p class="site-tagline">Register of retired geostationary satellites</p>
        </div>
      </div>
      <nav aria-label="Main"><ul id="nav-list" class="nav-list"></ul></nav>
    </header>
    <main id="main" tabindex="-1"></main>
    <noscript><p class="noscript">Sexton needs JavaScript to draw the register.</p></noscript>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
